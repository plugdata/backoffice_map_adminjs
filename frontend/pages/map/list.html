<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แผนที่ - Backoffice</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link href="../../assets/css/style.css" rel="stylesheet">
    <link href="../../assets/css/admin.css" rel="stylesheet">
</head>

<body>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <div class="d-flex">
        <nav class="sidebar bg-white border-end" id="sidebar"></nav>
        <main class="main-content flex-fill">
            <header id="main-header" class="bg-white border-bottom p-3 sticky-top shadow-sm"></header>
            <div class="page-content">
                <div class="page-header">
                    <h1 class="page-title" id="pageTitle">แผนที่</h1>
                    <p class="page-subtitle">จัดการข้อมูลแผนที่ในระบบ</p>
                </div>
                <div class="toolbar">
                    <div class="toolbar-left">
                        <a href="form.html" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>เพิ่มข้อมูล</a>
                        <button class="btn btn-outline-danger" id="bulkDeleteBtn" disabled><i
                                class="bi bi-trash me-1"></i>ลบที่เลือก (<span id="selectedCount">0</span>)</button>
                    </div>
                    <div class="toolbar-right">
                        <div class="search-box">
                            <i class="bi bi-search search-icon"></i>
                            <input type="text" class="form-control" id="searchInput" placeholder="ค้นหา...">
                        </div>
                        <button class="btn btn-outline-secondary" onclick="location.reload()"><i
                                class="bi bi-arrow-clockwise"></i></button>
                    </div>
                </div>
                <div class="card">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover" id="dataTable"></table>
                        </div>
                    </div>
                    <div class="card-footer bg-white">
                        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2">
                            <div id="recordCount" class="text-muted small"></div>
                            <div id="pagination"></div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <div id="loadingOverlay">
        <div class="loading-spinner">
            <div class="spinner-border text-primary" role="status"><span class="visually-hidden">กำลังโหลด...</span>
            </div>
            <div class="mt-2">กำลังโหลดข้อมูล...</div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/config.js"></script>
    <script src="../../assets/js/apiClient.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script src="../../assets/js/i18n.js"></script>
    <script src="../../assets/js/app.js"></script>
    <script src="../../modules/TableManager.js"></script>
    <script src="../../modules/PaginationManager.js"></script>
    <script src="../../modules/CrudManager.js"></script>
    <script>
        const RESOURCE_NAME = 'Map';
        if (!authManager.requireAuth()) { }
        let crudManager;
        async function loadComponents() {
            try { await Promise.all([loadComponent('../../components/navMenu.html', 'sidebar'), loadComponent('../../components/header.html', 'main-header')]); initPage(); }
            catch (error) { console.error('Error loading components:', error); }
        }
        async function initPage() {
            const resourceConfig = RESOURCES[RESOURCE_NAME];
            if (resourceConfig && document.getElementById('pageTitle')) document.getElementById('pageTitle').textContent = resourceConfig.labelPlural;
            document.title = `${resourceConfig ? resourceConfig.labelPlural : 'แผนที่'} - Backoffice`;
            if (window.setBreadcrumb) setBreadcrumb([{ label: 'หน้าหลัก', href: '/frontend/pages/dashboard.html' }, { label: resourceConfig ? resourceConfig.labelPlural : 'แผนที่' }]);
            crudManager = new CrudManager(RESOURCE_NAME);
            await crudManager.init();
            await crudManager.loadData();
        }
        document.addEventListener('DOMContentLoaded', loadComponents);
    </script>
</body>

</html>
