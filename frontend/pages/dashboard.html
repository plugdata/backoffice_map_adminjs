<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แดชบอร์ด - Backoffice</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts - Sarabun -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <!-- Custom CSS -->
    <link href="../assets/css/style.css" rel="stylesheet">
    <link href="../assets/css/admin.css" rel="stylesheet">
</head>

<body>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <div class="d-flex">
        <!-- Sidebar -->
        <nav class="sidebar bg-white border-end" id="sidebar">
            <!-- Sidebar content loaded from ../components/navMenu.html -->
        </nav>

        <!-- Main Content -->
        <main class="main-content flex-fill">
            <!-- Header -->
            <header id="main-header" class="bg-white border-bottom p-3 sticky-top shadow-sm">
                <!-- Header content loaded from ../components/header.html -->
            </header>

            <!-- Page Content -->
            <div class="page-content">
                <div class="page-header">
                    <h1 class="page-title">แดชบอร์ด</h1>
                    <p class="page-subtitle">ภาพรวมข้อมูลในระบบ</p>
                </div>

                <!-- Stats Cards -->
                <div class="row g-4 mb-4">
                    <div class="col-sm-6 col-xl-3">
                        <div class="stat-card bg-primary">
                            <div class="d-flex justify-content-between align-items-start">
                                <div>
                                    <div class="stat-value" id="statUsers">-</div>
                                    <div class="stat-label">ผู้ใช้งานทั้งหมด</div>
                                </div>
                                <i class="bi bi-people stat-icon"></i>
                            </div>
                        </div>
                    </div>
                    <div class="col-sm-6 col-xl-3">
                        <div class="stat-card bg-success">
                            <div class="d-flex justify-content-between align-items-start">
                                <div>
                                    <div class="stat-value" id="statOwners">-</div>
                                    <div class="stat-label">เจ้าของกรรมสิทธิ์</div>
                                </div>
                                <i class="bi bi-person-badge stat-icon"></i>
                            </div>
                        </div>
                    </div>
                    <div class="col-sm-6 col-xl-3">
                        <div class="stat-card bg-warning">
                            <div class="d-flex justify-content-between align-items-start">
                                <div>
                                    <div class="stat-value" id="statBuildings">-</div>
                                    <div class="stat-label">งานควบคุมอาคาร</div>
                                </div>
                                <i class="bi bi-building stat-icon"></i>
                            </div>
                        </div>
                    </div>
                    <div class="col-sm-6 col-xl-3">
                        <div class="stat-card bg-danger">
                            <div class="d-flex justify-content-between align-items-start">
                                <div>
                                    <div class="stat-value" id="statProjects">-</div>
                                    <div class="stat-label">โครงการทั้งหมด</div>
                                </div>
                                <i class="bi bi-clipboard-data stat-icon"></i>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Quick Links -->
                <div class="row g-4">
                    <div class="col-lg-8">
                        <div class="card">
                            <div class="card-header">
                                <h5 class="card-title mb-0">
                                    <i class="bi bi-lightning me-2"></i>เมนูด่วน
                                </h5>
                            </div>
                            <div class="card-body">
                                <div class="row g-3">
                                    <div class="col-sm-6 col-md-4">
                                        <a href="/frontend/pages/user/list.html"
                                            class="btn btn-outline-primary w-100 py-3">
                                            <i class="bi bi-people d-block fs-3 mb-1"></i>
                                            ผู้ใช้งาน
                                        </a>
                                    </div>
                                    <div class="col-sm-6 col-md-4">
                                        <a href="/frontend/pages/owner/list.html"
                                            class="btn btn-outline-success w-100 py-3">
                                            <i class="bi bi-person-badge d-block fs-3 mb-1"></i>
                                            เจ้าของกรรมสิทธิ์
                                        </a>
                                    </div>
                                    <div class="col-sm-6 col-md-4">
                                        <a href="/frontend/pages/building-control/list.html"
                                            class="btn btn-outline-warning w-100 py-3">
                                            <i class="bi bi-building d-block fs-3 mb-1"></i>
                                            งานควบคุมอาคาร
                                        </a>
                                    </div>
                                    <div class="col-sm-6 col-md-4">
                                        <a href="/frontend/pages/risk-zone/list.html"
                                            class="btn btn-outline-danger w-100 py-3">
                                            <i class="bi bi-exclamation-triangle d-block fs-3 mb-1"></i>
                                            งานระวางที่สาธารณะ
                                        </a>
                                    </div>
                                    <div class="col-sm-6 col-md-4">
                                        <a href="/frontend/pages/plan-project/list.html"
                                            class="btn btn-outline-info w-100 py-3">
                                            <i class="bi bi-clipboard-data d-block fs-3 mb-1"></i>
                                            แผนโครงการ
                                        </a>
                                    </div>
                                    <div class="col-sm-6 col-md-4">
                                        <a href="/frontend/pages/map/list.html"
                                            class="btn btn-outline-secondary w-100 py-3">
                                            <i class="bi bi-geo-alt d-block fs-3 mb-1"></i>
                                            แผนที่
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-4">
                        <div class="card">
                            <div class="card-header">
                                <h5 class="card-title mb-0">
                                    <i class="bi bi-info-circle me-2"></i>ข้อมูลระบบ
                                </h5>
                            </div>
                            <div class="card-body">
                                <ul class="list-group list-group-flush">
                                    <li class="list-group-item d-flex justify-content-between">
                                        <span class="text-muted">เวอร์ชัน</span>
                                        <strong>1.0.0</strong>
                                    </li>
                                    <li class="list-group-item d-flex justify-content-between">
                                        <span class="text-muted">วันที่</span>
                                        <strong id="currentDate">-</strong>
                                    </li>
                                    <li class="list-group-item d-flex justify-content-between">
                                        <span class="text-muted">ผู้เข้าสู่ระบบ</span>
                                        <strong id="loggedUser">-</strong>
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay">
        <div class="loading-spinner">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">กำลังโหลด...</span>
            </div>
            <div class="mt-2">กำลังโหลดข้อมูล...</div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Scripts -->
    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/apiClient.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/i18n.js"></script>
    <script src="../assets/js/app.js"></script>

    <script>
        // Check auth
        if (!authManager.requireAuth()) {
            // Will redirect to login
        }

        // Load components
        async function loadComponents() {
            try {
                // Load sidebar and header using helper from app.js
                await Promise.all([
                    loadComponent('../components/navMenu.html', 'sidebar'),
                    loadComponent('../components/header.html', 'main-header')
                ]);

                // Initialize after components loaded
                initDashboard();
            } catch (error) {
                console.error('Error loading components:', error);
            }
        }

        // Initialize dashboard
        async function initDashboard() {
            // Set breadcrumb
            if (window.setBreadcrumb) {
                setBreadcrumb([
                    { label: 'หน้าหลัก', href: '/frontend/pages/dashboard.html' },
                    { label: 'แดชบอร์ด' }
                ]);
            }

            // Set current date
            const dateEl = document.getElementById('currentDate');
            if (dateEl) {
                dateEl.textContent = typeof formatDateThai === 'function' ? formatDateThai(new Date()) : new Date().toLocaleDateString();
            }

            // Set logged user
            const userEl = document.getElementById('loggedUser');
            if (userEl) {
                const user = authManager.getUser();
                if (user) {
                    userEl.textContent = user.fullName || user.username || '-';
                }
            }

            // Load stats
            loadStats();
        }

        // Load statistics
        async function loadStats() {
            try {
                // Load counts from each resource
                const [users, owners, buildings, projects] = await Promise.all([
                    apiClient.list('User', { perPage: 1 }),
                    apiClient.list('Owner', { perPage: 1 }),
                    apiClient.list('BuildingControl', { perPage: 1 }),
                    apiClient.list('PlanProject', { perPage: 1 })
                ]).catch(err => {
                    console.warn('API client not ready or failed:', err);
                    return [{}, {}, {}, {}];
                });

                if (document.getElementById('statUsers')) document.getElementById('statUsers').textContent = formatNumber(users.meta?.total || 0);
                if (document.getElementById('statOwners')) document.getElementById('statOwners').textContent = formatNumber(owners.meta?.total || 0);
                if (document.getElementById('statBuildings')) document.getElementById('statBuildings').textContent = formatNumber(buildings.meta?.total || 0);
                if (document.getElementById('statProjects')) document.getElementById('statProjects').textContent = formatNumber(projects.meta?.total || 0);
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        // Helper for number formatting if not defined
        function formatNumber(num) {
            return num.toString().replace(/(\d)(?=(\d{3})+(?!\d))/g, '$1,');
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', loadComponents);
    </script>
</body>

</html>
